name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: nihal00002
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: actions/checkout@v4
        with:
          ref: output
      - run: |
          mkdir -p dist
          mv -f github-snake*.svg dist/ 2>/dev/null || true
          cp -r dist/* .
          git add -A
          git commit -m "Update snake" || echo "No changes"
          git push
